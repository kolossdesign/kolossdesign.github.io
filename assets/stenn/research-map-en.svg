<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1206" width="1600" height="1206"><rect width="1600" height="4000" fill="#F1F3F7"/><text x="56" y="74" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#12151c" text-anchor="start" letter-spacing="0">How a supplier gets to the money</text><path d="M58 84 C 206.79999999999998 81, 405.2 87, 554.0 84" stroke="#F5A623" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.35"/><text x="56" y="112" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#525b6b" text-anchor="start" letter-spacing="0">The journey from an issued invoice to a payout. Three sides, six steps.</text><rect x="56" y="140" width="197.6" height="40" rx="20" fill="#fff" stroke="#b8c0cc" stroke-width="1.4"/><circle cx="74" cy="160" r="5" fill="#F5A623"/><text x="88" y="166" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#12151c" text-anchor="start" letter-spacing="0">Supplier interviews</text><rect x="265.6" y="140" width="222.8" height="40" rx="20" fill="#fff" stroke="#b8c0cc" stroke-width="1.4"/><circle cx="283.6" cy="160" r="5" fill="#F5A623"/><text x="297.6" y="166" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#12151c" text-anchor="start" letter-spacing="0">Underwriter interviews</text><rect x="500.40000000000003" y="140" width="281.6" height="40" rx="20" fill="#fff" stroke="#b8c0cc" stroke-width="1.4"/><circle cx="518.4000000000001" cy="160" r="5" fill="#F5A623"/><text x="532.4000000000001" y="166" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#12151c" text-anchor="start" letter-spacing="0">Shadowing the operations team</text><rect x="794.0" y="140" width="164.0" height="40" rx="20" fill="#fff" stroke="#b8c0cc" stroke-width="1.4"/><circle cx="812.0" cy="160" r="5" fill="#F5A623"/><text x="826.0" y="166" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#12151c" text-anchor="start" letter-spacing="0">Deal log review</text><text x="56" y="222" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#525b6b" text-anchor="start" letter-spacing="1.2">STEP 1</text><text x="56" y="248" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#12151c" text-anchor="start" letter-spacing="0">Financing</text><text x="56" y="269" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#12151c" text-anchor="start" letter-spacing="0">application</text><text x="306" y="222" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#525b6b" text-anchor="start" letter-spacing="1.2">STEP 2</text><text x="306" y="248" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#12151c" text-anchor="start" letter-spacing="0">Company</text><text x="306" y="269" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#12151c" text-anchor="start" letter-spacing="0">check</text><text x="556" y="222" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#525b6b" text-anchor="start" letter-spacing="1.2">STEP 3</text><text x="556" y="248" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#12151c" text-anchor="start" letter-spacing="0">Limit</text><text x="556" y="269" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#12151c" text-anchor="start" letter-spacing="0">approval</text><text x="806" y="222" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#525b6b" text-anchor="start" letter-spacing="1.2">STEP 4</text><text x="806" y="248" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#12151c" text-anchor="start" letter-spacing="0">Invoice</text><text x="806" y="269" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#12151c" text-anchor="start" letter-spacing="0">upload</text><text x="1056" y="222" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#525b6b" text-anchor="start" letter-spacing="1.2">STEP 5</text><text x="1056" y="248" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#12151c" text-anchor="start" letter-spacing="0">Document</text><text x="1056" y="269" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#12151c" text-anchor="start" letter-spacing="0">check</text><text x="1306" y="222" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#525b6b" text-anchor="start" letter-spacing="1.2">STEP 6</text><text x="1306" y="248" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#12151c" text-anchor="start" letter-spacing="0">Payout</text><rect x="40" y="292" width="1520" height="152" rx="18" fill="#EFEBFF" stroke="#b8c0cc" stroke-width="1.2"/><text x="56" y="318" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800" fill="#525b6b" text-anchor="start" letter-spacing="1.4">SUPPLIER</text><rect x="56" y="330" width="234" height="96" rx="12" fill="#fff" stroke="#b8c0cc" stroke-width="1.4" transform="rotate(-0.7 173.0 378.0)"/><text x="70" y="354.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#12151c" text-anchor="start" letter-spacing="0">Fills in a form without knowing</text><text x="70" y="371.55" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#12151c" text-anchor="start" letter-spacing="0">what decides the outcome</text><rect x="306" y="330" width="234" height="96" rx="12" fill="#fff" stroke="#b8c0cc" stroke-width="1.4" transform="rotate(0.8 423.0 378.0)"/><text x="320" y="354.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#12151c" text-anchor="start" letter-spacing="0">Waits for an answer, learns the</text><text x="320" y="371.55" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#12151c" text-anchor="start" letter-spacing="0">status from an email</text><rect x="556" y="330" width="234" height="96" rx="12" fill="#fff" stroke="#b8c0cc" stroke-width="1.4"/><text x="570" y="354.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#12151c" text-anchor="start" letter-spacing="0">Cannot see how the limit was</text><text x="570" y="371.55" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#12151c" text-anchor="start" letter-spacing="0">calculated</text><rect x="806" y="330" width="234" height="96" rx="12" fill="#fff" stroke="#b8c0cc" stroke-width="1.4" transform="rotate(-0.7 923.0 378.0)"/><text x="820" y="354.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#12151c" text-anchor="start" letter-spacing="0">Uploads invoices in bulk,</text><text x="820" y="371.55" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#12151c" text-anchor="start" letter-spacing="0">formats vary</text><rect x="1056" y="330" width="234" height="96" rx="12" fill="#fff" stroke="#b8c0cc" stroke-width="1.4" transform="rotate(0.8 1173.0 378.0)"/><text x="1070" y="354.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#12151c" text-anchor="start" letter-spacing="0">Re-sends documents after</text><text x="1070" y="371.55" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#12151c" text-anchor="start" letter-spacing="0">comments</text><rect x="1306" y="330" width="234" height="96" rx="12" fill="#fff" stroke="#b8c0cc" stroke-width="1.4"/><text x="1320" y="354.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#12151c" text-anchor="start" letter-spacing="0">Waits for the money, the date</text><text x="1320" y="371.55" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#12151c" text-anchor="start" letter-spacing="0">is approximate</text><rect x="40" y="460" width="1520" height="152" rx="18" fill="#FFF1DC" stroke="#b8c0cc" stroke-width="1.2"/><text x="56" y="486" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800" fill="#525b6b" text-anchor="start" letter-spacing="1.4">OPERATIONS TEAM</text><rect x="56" y="498" width="234" height="96" rx="12" fill="#fff" stroke="#b8c0cc" stroke-width="1.4" transform="rotate(0.8 173.0 546.0)"/><text x="70" y="522.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#12151c" text-anchor="start" letter-spacing="0">Collects company data by hand</text><rect x="306" y="498" width="234" height="96" rx="12" fill="#fff" stroke="#b8c0cc" stroke-width="1.4"/><text x="320" y="522.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#12151c" text-anchor="start" letter-spacing="0">Cross-checks registries and</text><text x="320" y="539.55" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#12151c" text-anchor="start" letter-spacing="0">public sources</text><rect x="556" y="498" width="234" height="96" rx="12" fill="#fff" stroke="#b8c0cc" stroke-width="1.4" transform="rotate(-0.7 673.0 546.0)"/><text x="570" y="522.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#12151c" text-anchor="start" letter-spacing="0">Calculates the limit in a</text><text x="570" y="539.55" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#12151c" text-anchor="start" letter-spacing="0">spreadsheet</text><rect x="806" y="498" width="234" height="96" rx="12" fill="#fff" stroke="#b8c0cc" stroke-width="1.4" transform="rotate(0.8 923.0 546.0)"/><text x="820" y="522.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#12151c" text-anchor="start" letter-spacing="0">Checks completeness manually</text><rect x="1056" y="498" width="234" height="96" rx="12" fill="#fff" stroke="#b8c0cc" stroke-width="1.4"/><text x="1070" y="522.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#12151c" text-anchor="start" letter-spacing="0">Hunts for mismatches in amounts</text><text x="1070" y="539.55" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#12151c" text-anchor="start" letter-spacing="0">and dates</text><rect x="1306" y="498" width="234" height="96" rx="12" fill="#fff" stroke="#b8c0cc" stroke-width="1.4" transform="rotate(-0.7 1423.0 546.0)"/><text x="1320" y="522.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#12151c" text-anchor="start" letter-spacing="0">Prepares the payment and</text><text x="1320" y="539.55" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#12151c" text-anchor="start" letter-spacing="0">notifies the client</text><rect x="40" y="628" width="1520" height="152" rx="18" fill="#E7F0FF" stroke="#b8c0cc" stroke-width="1.2"/><text x="56" y="654" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800" fill="#525b6b" text-anchor="start" letter-spacing="1.4">SYSTEM</text><rect x="56" y="666" width="234" height="96" rx="12" fill="#fff" stroke="#b8c0cc" stroke-width="1.4"/><text x="70" y="690.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#12151c" text-anchor="start" letter-spacing="0">The application lands in a</text><text x="70" y="707.55" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#12151c" text-anchor="start" letter-spacing="0">shared queue</text><rect x="306" y="666" width="234" height="96" rx="12" fill="#fff" stroke="#b8c0cc" stroke-width="1.4" transform="rotate(-0.7 423.0 714.0)"/><text x="320" y="690.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#12151c" text-anchor="start" letter-spacing="0">Data sits in different services</text><rect x="556" y="666" width="234" height="96" rx="12" fill="#fff" stroke="#b8c0cc" stroke-width="1.4" transform="rotate(0.8 673.0 714.0)"/><text x="570" y="690.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#12151c" text-anchor="start" letter-spacing="0">The decision is recorded after</text><text x="570" y="707.55" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#12151c" text-anchor="start" letter-spacing="0">the fact</text><rect x="806" y="666" width="234" height="96" rx="12" fill="#fff" stroke="#b8c0cc" stroke-width="1.4"/><text x="820" y="690.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#12151c" text-anchor="start" letter-spacing="0">Files are not linked to the</text><text x="820" y="707.55" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#12151c" text-anchor="start" letter-spacing="0">deal</text><rect x="1056" y="666" width="234" height="96" rx="12" fill="#fff" stroke="#b8c0cc" stroke-width="1.4" transform="rotate(-0.7 1173.0 714.0)"/><text x="1070" y="690.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#12151c" text-anchor="start" letter-spacing="0">No history of comments</text><rect x="1306" y="666" width="234" height="96" rx="12" fill="#fff" stroke="#b8c0cc" stroke-width="1.4" transform="rotate(0.8 1423.0 714.0)"/><text x="1320" y="690.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#12151c" text-anchor="start" letter-spacing="0">The status is changed manually</text><text x="56" y="822" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800" fill="#525b6b" text-anchor="start" letter-spacing="1.4">WHERE IT BREAKS</text><path d="M56 827 C 101.0 824, 161.0 830, 206 827" stroke="#F5A623" stroke-width="9" stroke-linecap="round" fill="none" opacity="0.4"/><rect x="56" y="854" width="732" height="52" rx="12" fill="#FDECEC" stroke="#E8A0A0" stroke-width="1.6" transform="rotate(0.7 422.0 880.0)"/><circle cx="84" cy="880" r="12" fill="#C62828"/><text x="84" y="885" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#fff" text-anchor="middle" letter-spacing="0">2</text><text x="108" y="885" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#7a1220" text-anchor="start" letter-spacing="0">Manual cross-checking of company data</text><rect x="812" y="854" width="732" height="52" rx="12" fill="#FDECEC" stroke="#E8A0A0" stroke-width="1.6" transform="rotate(-0.8 1178.0 880.0)"/><circle cx="840" cy="880" r="12" fill="#C62828"/><text x="840" y="885" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#fff" text-anchor="middle" letter-spacing="0">3</text><text x="864" y="885" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#7a1220" text-anchor="start" letter-spacing="0">The limit decision is opaque</text><rect x="56" y="920" width="732" height="52" rx="12" fill="#FDECEC" stroke="#E8A0A0" stroke-width="1.6" transform="rotate(0.7 422.0 946.0)"/><circle cx="84" cy="946" r="12" fill="#C62828"/><text x="84" y="951" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#fff" text-anchor="middle" letter-spacing="0">3</text><text x="108" y="951" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#7a1220" text-anchor="start" letter-spacing="0">The limit calculation lives outside the system</text><rect x="812" y="920" width="732" height="52" rx="12" fill="#FDECEC" stroke="#E8A0A0" stroke-width="1.6" transform="rotate(-0.8 1178.0 946.0)"/><circle cx="840" cy="946" r="12" fill="#C62828"/><text x="840" y="951" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#fff" text-anchor="middle" letter-spacing="0">5</text><text x="864" y="951" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#7a1220" text-anchor="start" letter-spacing="0">Documents go in circles over comments</text><rect x="56" y="986" width="732" height="52" rx="12" fill="#FDECEC" stroke="#E8A0A0" stroke-width="1.6" transform="rotate(0.7 422.0 1012.0)"/><circle cx="84" cy="1012" r="12" fill="#C62828"/><text x="84" y="1017" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#fff" text-anchor="middle" letter-spacing="0">5</text><text x="108" y="1017" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#7a1220" text-anchor="start" letter-spacing="0">The review history is not kept</text><rect x="812" y="986" width="732" height="52" rx="12" fill="#FDECEC" stroke="#E8A0A0" stroke-width="1.6" transform="rotate(-0.8 1178.0 1012.0)"/><circle cx="840" cy="1012" r="12" fill="#C62828"/><text x="840" y="1017" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#fff" text-anchor="middle" letter-spacing="0">6</text><text x="864" y="1017" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#7a1220" text-anchor="start" letter-spacing="0">The payout date cannot be given precisely</text><rect x="40" y="1074" width="1520" height="92" rx="18" fill="#241463"/><text x="72" y="1112" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="start" letter-spacing="1.4">RESEARCH FINDING</text><text x="72" y="1144" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500" fill="#ffffff" text-anchor="start" letter-spacing="0">Deal speed is eaten not by the checks themselves but by manual handovers between steps and by opaque status.</text></svg>