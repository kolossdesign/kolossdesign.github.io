<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1186" width="1600" height="1186"><rect width="1600" height="2000" fill="#FBFBFB"/><text x="56" y="72" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#171a22" text-anchor="start" letter-spacing="0">Как поставщик доходит до денег</text><text x="56" y="108" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#6b7280" text-anchor="start" letter-spacing="0">Карта пути от выставленного счета до выплаты. Шесть шагов, три стороны, точки, где сделка встает.</text><rect x="56" y="136" width="227.20000000000002" height="38" rx="19" fill="#fff" stroke="#e3e4e8" stroke-width="1"/><circle cx="73" cy="155" r="4" fill="#F5A623"/><text x="86" y="161" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#171a22" text-anchor="start" letter-spacing="0">Интервью с поставщиками</text><rect x="295.20000000000005" y="136" width="244.0" height="38" rx="19" fill="#fff" stroke="#e3e4e8" stroke-width="1"/><circle cx="312.20000000000005" cy="155" r="4" fill="#F5A623"/><text x="325.20000000000005" y="161" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#171a22" text-anchor="start" letter-spacing="0">Интервью с андеррайтерами</text><rect x="551.2" y="136" width="302.8" height="38" rx="19" fill="#fff" stroke="#e3e4e8" stroke-width="1"/><circle cx="568.2" cy="155" r="4" fill="#F5A623"/><text x="581.2" y="161" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#171a22" text-anchor="start" letter-spacing="0">Наблюдение за работой операторов</text><rect x="866.0" y="136" width="193.6" height="38" rx="19" fill="#fff" stroke="#e3e4e8" stroke-width="1"/><circle cx="883.0" cy="155" r="4" fill="#F5A623"/><text x="896.0" y="161" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#171a22" text-anchor="start" letter-spacing="0">Разбор логов сделок</text><text x="56" y="214" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#6b7280" text-anchor="start" letter-spacing="1.2">ШАГ 1</text><text x="56" y="240" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#171a22" text-anchor="start" letter-spacing="0">Заявка</text><text x="56" y="261" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#171a22" text-anchor="start" letter-spacing="0">на финансирование</text><text x="306" y="214" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#6b7280" text-anchor="start" letter-spacing="1.2">ШАГ 2</text><text x="306" y="240" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#171a22" text-anchor="start" letter-spacing="0">Проверка</text><text x="306" y="261" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#171a22" text-anchor="start" letter-spacing="0">компании</text><text x="556" y="214" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#6b7280" text-anchor="start" letter-spacing="1.2">ШАГ 3</text><text x="556" y="240" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#171a22" text-anchor="start" letter-spacing="0">Согласование</text><text x="556" y="261" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#171a22" text-anchor="start" letter-spacing="0">лимита</text><text x="806" y="214" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#6b7280" text-anchor="start" letter-spacing="1.2">ШАГ 4</text><text x="806" y="240" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#171a22" text-anchor="start" letter-spacing="0">Загрузка</text><text x="806" y="261" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#171a22" text-anchor="start" letter-spacing="0">счетов</text><text x="1056" y="214" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#6b7280" text-anchor="start" letter-spacing="1.2">ШАГ 5</text><text x="1056" y="240" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#171a22" text-anchor="start" letter-spacing="0">Проверка</text><text x="1056" y="261" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#171a22" text-anchor="start" letter-spacing="0">документов</text><text x="1306" y="214" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#6b7280" text-anchor="start" letter-spacing="1.2">ШАГ 6</text><text x="1306" y="240" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#171a22" text-anchor="start" letter-spacing="0">Выплата</text><rect x="40" y="284" width="1520" height="150" rx="18" fill="#F6F4FF"/><text x="56" y="310" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#6b7280" text-anchor="start" letter-spacing="1.4">ПОСТАВЩИК</text><rect x="56" y="322" width="234" height="94" rx="12" fill="#fff" stroke="#e3e4e8" stroke-width="1"/><text x="70" y="344.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#171a22" text-anchor="start" letter-spacing="0">Заполняет форму, не</text><text x="70" y="361.55" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#171a22" text-anchor="start" letter-spacing="0">понимая, что решит исход</text><rect x="306" y="322" width="234" height="94" rx="12" fill="#fff" stroke="#e3e4e8" stroke-width="1"/><text x="320" y="344.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#171a22" text-anchor="start" letter-spacing="0">Ждет ответа, статус узнает</text><text x="320" y="361.55" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#171a22" text-anchor="start" letter-spacing="0">по письму</text><rect x="556" y="322" width="234" height="94" rx="12" fill="#fff" stroke="#e3e4e8" stroke-width="1"/><text x="570" y="344.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#171a22" text-anchor="start" letter-spacing="0">Не видит, из чего сложился</text><text x="570" y="361.55" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#171a22" text-anchor="start" letter-spacing="0">лимит</text><rect x="806" y="322" width="234" height="94" rx="12" fill="#fff" stroke="#e3e4e8" stroke-width="1"/><text x="820" y="344.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#171a22" text-anchor="start" letter-spacing="0">Грузит счета пачкой,</text><text x="820" y="361.55" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#171a22" text-anchor="start" letter-spacing="0">форматы разные</text><rect x="1056" y="322" width="234" height="94" rx="12" fill="#fff" stroke="#e3e4e8" stroke-width="1"/><text x="1070" y="344.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#171a22" text-anchor="start" letter-spacing="0">Переотправляет документы</text><text x="1070" y="361.55" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#171a22" text-anchor="start" letter-spacing="0">по замечаниям</text><rect x="1306" y="322" width="234" height="94" rx="12" fill="#fff" stroke="#e3e4e8" stroke-width="1"/><text x="1320" y="344.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#171a22" text-anchor="start" letter-spacing="0">Ждет деньги, дату называют</text><text x="1320" y="361.55" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#171a22" text-anchor="start" letter-spacing="0">примерно</text><rect x="40" y="450" width="1520" height="150" rx="18" fill="#FFF7EC"/><text x="56" y="476" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#6b7280" text-anchor="start" letter-spacing="1.4">ОПЕРАЦИОННАЯ КОМАНДА</text><rect x="56" y="488" width="234" height="94" rx="12" fill="#fff" stroke="#e3e4e8" stroke-width="1"/><text x="70" y="510.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#171a22" text-anchor="start" letter-spacing="0">Собирает данные о компании</text><text x="70" y="527.55" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#171a22" text-anchor="start" letter-spacing="0">вручную</text><rect x="306" y="488" width="234" height="94" rx="12" fill="#fff" stroke="#e3e4e8" stroke-width="1"/><text x="320" y="510.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#171a22" text-anchor="start" letter-spacing="0">Сверяет реестры и открытые</text><text x="320" y="527.55" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#171a22" text-anchor="start" letter-spacing="0">источники</text><rect x="556" y="488" width="234" height="94" rx="12" fill="#fff" stroke="#e3e4e8" stroke-width="1"/><text x="570" y="510.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#171a22" text-anchor="start" letter-spacing="0">Считает лимит в отдельной</text><text x="570" y="527.55" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#171a22" text-anchor="start" letter-spacing="0">таблице</text><rect x="806" y="488" width="234" height="94" rx="12" fill="#fff" stroke="#e3e4e8" stroke-width="1"/><text x="820" y="510.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#171a22" text-anchor="start" letter-spacing="0">Проверяет комплектность</text><text x="820" y="527.55" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#171a22" text-anchor="start" letter-spacing="0">вручную</text><rect x="1056" y="488" width="234" height="94" rx="12" fill="#fff" stroke="#e3e4e8" stroke-width="1"/><text x="1070" y="510.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#171a22" text-anchor="start" letter-spacing="0">Ищет расхождения в суммах</text><text x="1070" y="527.55" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#171a22" text-anchor="start" letter-spacing="0">и датах</text><rect x="1306" y="488" width="234" height="94" rx="12" fill="#fff" stroke="#e3e4e8" stroke-width="1"/><text x="1320" y="510.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#171a22" text-anchor="start" letter-spacing="0">Готовит платеж и</text><text x="1320" y="527.55" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#171a22" text-anchor="start" letter-spacing="0">уведомляет клиента</text><rect x="40" y="616" width="1520" height="150" rx="18" fill="#F2F6FF"/><text x="56" y="642" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#6b7280" text-anchor="start" letter-spacing="1.4">СИСТЕМА</text><rect x="56" y="654" width="234" height="94" rx="12" fill="#fff" stroke="#e3e4e8" stroke-width="1"/><text x="70" y="676.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#171a22" text-anchor="start" letter-spacing="0">Заявка попадает в общую</text><text x="70" y="693.55" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#171a22" text-anchor="start" letter-spacing="0">очередь</text><rect x="306" y="654" width="234" height="94" rx="12" fill="#fff" stroke="#e3e4e8" stroke-width="1"/><text x="320" y="676.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#171a22" text-anchor="start" letter-spacing="0">Данные лежат в разных</text><text x="320" y="693.55" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#171a22" text-anchor="start" letter-spacing="0">сервисах</text><rect x="556" y="654" width="234" height="94" rx="12" fill="#fff" stroke="#e3e4e8" stroke-width="1"/><text x="570" y="676.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#171a22" text-anchor="start" letter-spacing="0">Решение фиксируется</text><text x="570" y="693.55" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#171a22" text-anchor="start" letter-spacing="0">постфактум</text><rect x="806" y="654" width="234" height="94" rx="12" fill="#fff" stroke="#e3e4e8" stroke-width="1"/><text x="820" y="676.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#171a22" text-anchor="start" letter-spacing="0">Файлы без привязки к</text><text x="820" y="693.55" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#171a22" text-anchor="start" letter-spacing="0">сделке</text><rect x="1056" y="654" width="234" height="94" rx="12" fill="#fff" stroke="#e3e4e8" stroke-width="1"/><text x="1070" y="676.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#171a22" text-anchor="start" letter-spacing="0">Нет истории замечаний</text><rect x="1306" y="654" width="234" height="94" rx="12" fill="#fff" stroke="#e3e4e8" stroke-width="1"/><text x="1320" y="676.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#171a22" text-anchor="start" letter-spacing="0">Статус меняется вручную</text><text x="56" y="808" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#6b7280" text-anchor="start" letter-spacing="1.4">ГДЕ СДЕЛКА ВСТАЕТ</text><rect x="56" y="840" width="730" height="52" rx="12" fill="#FDF2F2" stroke="#F0CFCF" stroke-width="1"/><circle cx="82" cy="866" r="11" fill="#D64545"/><text x="82" y="871" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="0">2</text><text x="106" y="871" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#7a1220" text-anchor="start" letter-spacing="0">Решение по лимиту непрозрачно для клиента</text><rect x="816" y="840" width="730" height="52" rx="12" fill="#FDF2F2" stroke="#F0CFCF" stroke-width="1"/><circle cx="842" cy="866" r="11" fill="#D64545"/><text x="842" y="871" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="0">4</text><text x="866" y="871" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#7a1220" text-anchor="start" letter-spacing="0">Документы ходят кругами по замечаниям</text><rect x="56" y="906" width="730" height="52" rx="12" fill="#FDF2F2" stroke="#F0CFCF" stroke-width="1"/><circle cx="82" cy="932" r="11" fill="#D64545"/><text x="82" y="937" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="0">1</text><text x="106" y="937" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#7a1220" text-anchor="start" letter-spacing="0">Ручная сверка данных о компании</text><rect x="816" y="906" width="730" height="52" rx="12" fill="#FDF2F2" stroke="#F0CFCF" stroke-width="1"/><circle cx="842" cy="932" r="11" fill="#D64545"/><text x="842" y="937" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="0">6</text><text x="866" y="937" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#7a1220" text-anchor="start" letter-spacing="0">Дату выплаты нельзя назвать точно</text><rect x="56" y="972" width="730" height="52" rx="12" fill="#FDF2F2" stroke="#F0CFCF" stroke-width="1"/><circle cx="82" cy="998" r="11" fill="#D64545"/><text x="82" y="1003" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="0">3</text><text x="106" y="1003" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#7a1220" text-anchor="start" letter-spacing="0">Расчет лимита живет вне системы</text><rect x="816" y="972" width="730" height="52" rx="12" fill="#FDF2F2" stroke="#F0CFCF" stroke-width="1"/><circle cx="842" cy="998" r="11" fill="#D64545"/><text x="842" y="1003" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="0">5</text><text x="866" y="1003" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#7a1220" text-anchor="start" letter-spacing="0">История проверки не сохраняется</text><rect x="40" y="1060" width="1520" height="86" rx="18" fill="#2A1A6B" stroke="#2A1A6B" stroke-width="1"/><text x="72" y="1098" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#B9AEE8" text-anchor="start" letter-spacing="1.2">Вывод исследования</text><text x="72" y="1128" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500" fill="#ffffff" text-anchor="start" letter-spacing="0">Скорость сделки съедает не проверка сама по себе, а ручные переходы между шагами и непрозрачность статуса для обеих сторон.</text></svg>