<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1206" width="1600" height="1206"><rect width="1600" height="4000" fill="#F1F3F7"/><text x="56" y="74" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#12151c" text-anchor="start" letter-spacing="0">Как поставщик доходит до денег</text><path d="M58 84 C 197.5 81, 383.5 87, 523.0 84" stroke="#F5A623" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.35"/><text x="56" y="112" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#525b6b" text-anchor="start" letter-spacing="0">Карта пути от выставленного счета до выплаты. Три стороны, шесть шагов.</text><rect x="56" y="140" width="231.20000000000002" height="40" rx="20" fill="#fff" stroke="#b8c0cc" stroke-width="1.4"/><circle cx="74" cy="160" r="5" fill="#F5A623"/><text x="88" y="166" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#12151c" text-anchor="start" letter-spacing="0">Интервью с поставщиками</text><rect x="299.20000000000005" y="140" width="248.0" height="40" rx="20" fill="#fff" stroke="#b8c0cc" stroke-width="1.4"/><circle cx="317.20000000000005" cy="160" r="5" fill="#F5A623"/><text x="331.20000000000005" y="166" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#12151c" text-anchor="start" letter-spacing="0">Интервью с андеррайтерами</text><rect x="559.2" y="140" width="248.0" height="40" rx="20" fill="#fff" stroke="#b8c0cc" stroke-width="1.4"/><circle cx="577.2" cy="160" r="5" fill="#F5A623"/><text x="591.2" y="166" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#12151c" text-anchor="start" letter-spacing="0">Наблюдение за операторами</text><rect x="819.2" y="140" width="197.6" height="40" rx="20" fill="#fff" stroke="#b8c0cc" stroke-width="1.4"/><circle cx="837.2" cy="160" r="5" fill="#F5A623"/><text x="851.2" y="166" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#12151c" text-anchor="start" letter-spacing="0">Разбор логов сделок</text><text x="56" y="222" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#525b6b" text-anchor="start" letter-spacing="1.2">ШАГ 1</text><text x="56" y="248" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#12151c" text-anchor="start" letter-spacing="0">Заявка</text><text x="56" y="269" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#12151c" text-anchor="start" letter-spacing="0">на финансирование</text><text x="306" y="222" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#525b6b" text-anchor="start" letter-spacing="1.2">ШАГ 2</text><text x="306" y="248" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#12151c" text-anchor="start" letter-spacing="0">Проверка</text><text x="306" y="269" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#12151c" text-anchor="start" letter-spacing="0">компании</text><text x="556" y="222" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#525b6b" text-anchor="start" letter-spacing="1.2">ШАГ 3</text><text x="556" y="248" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#12151c" text-anchor="start" letter-spacing="0">Согласование</text><text x="556" y="269" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#12151c" text-anchor="start" letter-spacing="0">лимита</text><text x="806" y="222" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#525b6b" text-anchor="start" letter-spacing="1.2">ШАГ 4</text><text x="806" y="248" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#12151c" text-anchor="start" letter-spacing="0">Загрузка</text><text x="806" y="269" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#12151c" text-anchor="start" letter-spacing="0">счетов</text><text x="1056" y="222" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#525b6b" text-anchor="start" letter-spacing="1.2">ШАГ 5</text><text x="1056" y="248" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#12151c" text-anchor="start" letter-spacing="0">Проверка</text><text x="1056" y="269" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#12151c" text-anchor="start" letter-spacing="0">документов</text><text x="1306" y="222" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#525b6b" text-anchor="start" letter-spacing="1.2">ШАГ 6</text><text x="1306" y="248" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#12151c" text-anchor="start" letter-spacing="0">Выплата</text><rect x="40" y="292" width="1520" height="152" rx="18" fill="#EFEBFF" stroke="#b8c0cc" stroke-width="1.2"/><text x="56" y="318" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800" fill="#525b6b" text-anchor="start" letter-spacing="1.4">ПОСТАВЩИК</text><rect x="56" y="330" width="234" height="96" rx="12" fill="#fff" stroke="#b8c0cc" stroke-width="1.4" transform="rotate(-0.65 173.0 378.0)"/><text x="70" y="354.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#12151c" text-anchor="start" letter-spacing="0">Заполняет форму, не понимая,</text><text x="70" y="371.55" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#12151c" text-anchor="start" letter-spacing="0">что решит исход</text><rect x="306" y="330" width="234" height="96" rx="12" fill="#fff" stroke="#b8c0cc" stroke-width="1.4" transform="rotate(0.78 423.0 378.0)"/><text x="320" y="354.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#12151c" text-anchor="start" letter-spacing="0">Ждет ответа, статус узнает по</text><text x="320" y="371.55" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#12151c" text-anchor="start" letter-spacing="0">письму</text><rect x="556" y="330" width="234" height="96" rx="12" fill="#fff" stroke="#b8c0cc" stroke-width="1.4"/><text x="570" y="354.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#12151c" text-anchor="start" letter-spacing="0">Не видит, из чего сложился</text><text x="570" y="371.55" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#12151c" text-anchor="start" letter-spacing="0">лимит</text><rect x="806" y="330" width="234" height="96" rx="12" fill="#fff" stroke="#b8c0cc" stroke-width="1.4" transform="rotate(-0.65 923.0 378.0)"/><text x="820" y="354.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#12151c" text-anchor="start" letter-spacing="0">Грузит счета пачкой, форматы</text><text x="820" y="371.55" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#12151c" text-anchor="start" letter-spacing="0">разные</text><rect x="1056" y="330" width="234" height="96" rx="12" fill="#fff" stroke="#b8c0cc" stroke-width="1.4" transform="rotate(0.78 1173.0 378.0)"/><text x="1070" y="354.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#12151c" text-anchor="start" letter-spacing="0">Переотправляет документы по</text><text x="1070" y="371.55" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#12151c" text-anchor="start" letter-spacing="0">замечаниям</text><rect x="1306" y="330" width="234" height="96" rx="12" fill="#fff" stroke="#b8c0cc" stroke-width="1.4"/><text x="1320" y="354.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#12151c" text-anchor="start" letter-spacing="0">Ждет деньги, дату называют</text><text x="1320" y="371.55" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#12151c" text-anchor="start" letter-spacing="0">примерно</text><rect x="40" y="460" width="1520" height="152" rx="18" fill="#FFF1DC" stroke="#b8c0cc" stroke-width="1.2"/><text x="56" y="486" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800" fill="#525b6b" text-anchor="start" letter-spacing="1.4">ОПЕРАЦИОННАЯ КОМАНДА</text><rect x="56" y="498" width="234" height="96" rx="12" fill="#fff" stroke="#b8c0cc" stroke-width="1.4" transform="rotate(0.78 173.0 546.0)"/><text x="70" y="522.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#12151c" text-anchor="start" letter-spacing="0">Собирает данные о компании</text><text x="70" y="539.55" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#12151c" text-anchor="start" letter-spacing="0">вручную</text><rect x="306" y="498" width="234" height="96" rx="12" fill="#fff" stroke="#b8c0cc" stroke-width="1.4"/><text x="320" y="522.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#12151c" text-anchor="start" letter-spacing="0">Сверяет реестры и открытые</text><text x="320" y="539.55" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#12151c" text-anchor="start" letter-spacing="0">источники</text><rect x="556" y="498" width="234" height="96" rx="12" fill="#fff" stroke="#b8c0cc" stroke-width="1.4" transform="rotate(-0.65 673.0 546.0)"/><text x="570" y="522.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#12151c" text-anchor="start" letter-spacing="0">Считает лимит в отдельной</text><text x="570" y="539.55" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#12151c" text-anchor="start" letter-spacing="0">таблице</text><rect x="806" y="498" width="234" height="96" rx="12" fill="#fff" stroke="#b8c0cc" stroke-width="1.4" transform="rotate(0.78 923.0 546.0)"/><text x="820" y="522.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#12151c" text-anchor="start" letter-spacing="0">Проверяет комплектность вручную</text><rect x="1056" y="498" width="234" height="96" rx="12" fill="#fff" stroke="#b8c0cc" stroke-width="1.4"/><text x="1070" y="522.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#12151c" text-anchor="start" letter-spacing="0">Ищет расхождения в суммах и</text><text x="1070" y="539.55" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#12151c" text-anchor="start" letter-spacing="0">датах</text><rect x="1306" y="498" width="234" height="96" rx="12" fill="#fff" stroke="#b8c0cc" stroke-width="1.4" transform="rotate(-0.65 1423.0 546.0)"/><text x="1320" y="522.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#12151c" text-anchor="start" letter-spacing="0">Готовит платеж и уведомляет</text><text x="1320" y="539.55" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#12151c" text-anchor="start" letter-spacing="0">клиента</text><rect x="40" y="628" width="1520" height="152" rx="18" fill="#E7F0FF" stroke="#b8c0cc" stroke-width="1.2"/><text x="56" y="654" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800" fill="#525b6b" text-anchor="start" letter-spacing="1.4">СИСТЕМА</text><rect x="56" y="666" width="234" height="96" rx="12" fill="#fff" stroke="#b8c0cc" stroke-width="1.4"/><text x="70" y="690.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#12151c" text-anchor="start" letter-spacing="0">Заявка попадает в общую очередь</text><rect x="306" y="666" width="234" height="96" rx="12" fill="#fff" stroke="#b8c0cc" stroke-width="1.4" transform="rotate(-0.65 423.0 714.0)"/><text x="320" y="690.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#12151c" text-anchor="start" letter-spacing="0">Данные лежат в разных сервисах</text><rect x="556" y="666" width="234" height="96" rx="12" fill="#fff" stroke="#b8c0cc" stroke-width="1.4" transform="rotate(0.78 673.0 714.0)"/><text x="570" y="690.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#12151c" text-anchor="start" letter-spacing="0">Решение фиксируется постфактум</text><rect x="806" y="666" width="234" height="96" rx="12" fill="#fff" stroke="#b8c0cc" stroke-width="1.4"/><text x="820" y="690.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#12151c" text-anchor="start" letter-spacing="0">Файлы без привязки к сделке</text><rect x="1056" y="666" width="234" height="96" rx="12" fill="#fff" stroke="#b8c0cc" stroke-width="1.4" transform="rotate(-0.65 1173.0 714.0)"/><text x="1070" y="690.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#12151c" text-anchor="start" letter-spacing="0">Нет истории замечаний</text><rect x="1306" y="666" width="234" height="96" rx="12" fill="#fff" stroke="#b8c0cc" stroke-width="1.4" transform="rotate(0.78 1423.0 714.0)"/><text x="1320" y="690.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#12151c" text-anchor="start" letter-spacing="0">Статус меняется вручную</text><text x="56" y="822" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800" fill="#525b6b" text-anchor="start" letter-spacing="1.4">ГДЕ ТЕРЯЕТСЯ</text><path d="M56 827 C 96.19999999999999 824, 149.8 830, 190 827" stroke="#F5A623" stroke-width="9" stroke-linecap="round" fill="none" opacity="0.4"/><rect x="56" y="854" width="732" height="52" rx="12" fill="#FDECEC" stroke="#E8A0A0" stroke-width="1.6" transform="rotate(0.65 422.0 880.0)"/><circle cx="84" cy="880" r="12" fill="#C62828"/><text x="84" y="885" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#fff" text-anchor="middle" letter-spacing="0">2</text><text x="108" y="885" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#7a1220" text-anchor="start" letter-spacing="0">Ручная сверка данных о компании</text><rect x="812" y="854" width="732" height="52" rx="12" fill="#FDECEC" stroke="#E8A0A0" stroke-width="1.6" transform="rotate(-0.78 1178.0 880.0)"/><circle cx="840" cy="880" r="12" fill="#C62828"/><text x="840" y="885" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#fff" text-anchor="middle" letter-spacing="0">3</text><text x="864" y="885" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#7a1220" text-anchor="start" letter-spacing="0">Решение по лимиту непрозрачно</text><rect x="56" y="920" width="732" height="52" rx="12" fill="#FDECEC" stroke="#E8A0A0" stroke-width="1.6" transform="rotate(0.65 422.0 946.0)"/><circle cx="84" cy="946" r="12" fill="#C62828"/><text x="84" y="951" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#fff" text-anchor="middle" letter-spacing="0">3</text><text x="108" y="951" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#7a1220" text-anchor="start" letter-spacing="0">Расчет лимита живет вне системы</text><rect x="812" y="920" width="732" height="52" rx="12" fill="#FDECEC" stroke="#E8A0A0" stroke-width="1.6" transform="rotate(-0.78 1178.0 946.0)"/><circle cx="840" cy="946" r="12" fill="#C62828"/><text x="840" y="951" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#fff" text-anchor="middle" letter-spacing="0">5</text><text x="864" y="951" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#7a1220" text-anchor="start" letter-spacing="0">Документы ходят кругами по замечаниям</text><rect x="56" y="986" width="732" height="52" rx="12" fill="#FDECEC" stroke="#E8A0A0" stroke-width="1.6" transform="rotate(0.65 422.0 1012.0)"/><circle cx="84" cy="1012" r="12" fill="#C62828"/><text x="84" y="1017" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#fff" text-anchor="middle" letter-spacing="0">5</text><text x="108" y="1017" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#7a1220" text-anchor="start" letter-spacing="0">История проверки не сохраняется</text><rect x="812" y="986" width="732" height="52" rx="12" fill="#FDECEC" stroke="#E8A0A0" stroke-width="1.6" transform="rotate(-0.78 1178.0 1012.0)"/><circle cx="840" cy="1012" r="12" fill="#C62828"/><text x="840" y="1017" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#fff" text-anchor="middle" letter-spacing="0">6</text><text x="864" y="1017" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#7a1220" text-anchor="start" letter-spacing="0">Дату выплаты нельзя назвать точно</text><rect x="40" y="1074" width="1520" height="92" rx="18" fill="#241463"/><text x="72" y="1112" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="start" letter-spacing="1.4">ВЫВОД ИССЛЕДОВАНИЯ</text><text x="72" y="1144" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500" fill="#ffffff" text-anchor="start" letter-spacing="0">Скорость сделки съедает не проверка сама по себе, а ручные переходы между шагами и непрозрачность статуса.</text></svg>