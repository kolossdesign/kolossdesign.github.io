<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1206" width="1600" height="1206"><rect width="1600" height="4000" fill="#F1F3F7"/><text x="56" y="74" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#12151c" text-anchor="start" letter-spacing="0">Discovery: как бронь работает без продукта</text><path d="M58 84 C 253.29999999999998 81, 513.7 87, 709.0 84" stroke="#D1082C" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.35"/><text x="56" y="112" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#525b6b" text-anchor="start" letter-spacing="0">Карта текущего процесса. Три стороны, пять шагов, шесть точек потери.</text><rect x="56" y="140" width="189.20000000000002" height="40" rx="20" fill="#fff" stroke="#b8c0cc" stroke-width="1.4"/><circle cx="74" cy="160" r="5" fill="#D1082C"/><text x="88" y="166" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#12151c" text-anchor="start" letter-spacing="0">Интервью с гостями</text><rect x="257.20000000000005" y="140" width="239.60000000000002" height="40" rx="20" fill="#fff" stroke="#b8c0cc" stroke-width="1.4"/><circle cx="275.20000000000005" cy="160" r="5" fill="#D1082C"/><text x="289.20000000000005" y="166" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#12151c" text-anchor="start" letter-spacing="0">Интервью с рестораторами</text><rect x="508.80000000000007" y="140" width="264.8" height="40" rx="20" fill="#fff" stroke="#b8c0cc" stroke-width="1.4"/><circle cx="526.8000000000001" cy="160" r="5" fill="#D1082C"/><text x="540.8000000000001" y="166" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#12151c" text-anchor="start" letter-spacing="0">Наблюдение за сменой хостес</text><rect x="785.6000000000001" y="140" width="214.4" height="40" rx="20" fill="#fff" stroke="#b8c0cc" stroke-width="1.4"/><circle cx="803.6000000000001" cy="160" r="5" fill="#D1082C"/><text x="817.6000000000001" y="166" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#12151c" text-anchor="start" letter-spacing="0">Разбор журналов брони</text><text x="56" y="222" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#525b6b" text-anchor="start" letter-spacing="1.2">ШАГ 1</text><text x="56" y="248" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#12151c" text-anchor="start" letter-spacing="0">Гость выбирает</text><text x="56" y="269" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#12151c" text-anchor="start" letter-spacing="0">заведение</text><text x="356" y="222" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#525b6b" text-anchor="start" letter-spacing="1.2">ШАГ 2</text><text x="356" y="248" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#12151c" text-anchor="start" letter-spacing="0">Звонок в ресторан</text><text x="656" y="222" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#525b6b" text-anchor="start" letter-spacing="1.2">ШАГ 3</text><text x="656" y="248" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#12151c" text-anchor="start" letter-spacing="0">Ответ хостес</text><text x="956" y="222" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#525b6b" text-anchor="start" letter-spacing="1.2">ШАГ 4</text><text x="956" y="248" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#12151c" text-anchor="start" letter-spacing="0">Запись в журнал</text><text x="1256" y="222" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#525b6b" text-anchor="start" letter-spacing="1.2">ШАГ 5</text><text x="1256" y="248" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#12151c" text-anchor="start" letter-spacing="0">Приход гостя</text><rect x="40" y="292" width="1520" height="152" rx="18" fill="#EFEBFF" stroke="#b8c0cc" stroke-width="1.2"/><text x="56" y="318" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800" fill="#525b6b" text-anchor="start" letter-spacing="1.4">ГОСТЬ</text><rect x="56" y="330" width="284" height="96" rx="12" fill="#fff" stroke="#b8c0cc" stroke-width="1.4" transform="rotate(-0.65 198.0 378.0)"/><text x="70" y="354.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#12151c" text-anchor="start" letter-spacing="0">Ищет телефон в поиске, соцсетях или у</text><text x="70" y="371.55" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#12151c" text-anchor="start" letter-spacing="0">друзей</text><rect x="356" y="330" width="284" height="96" rx="12" fill="#fff" stroke="#b8c0cc" stroke-width="1.4" transform="rotate(0.78 498.0 378.0)"/><text x="370" y="354.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#12151c" text-anchor="start" letter-spacing="0">Звонит; часто занято или никто не</text><text x="370" y="371.55" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#12151c" text-anchor="start" letter-spacing="0">берет</text><rect x="656" y="330" width="284" height="96" rx="12" fill="#fff" stroke="#b8c0cc" stroke-width="1.4"/><text x="670" y="354.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#12151c" text-anchor="start" letter-spacing="0">На слух запоминает время и условия</text><rect x="956" y="330" width="284" height="96" rx="12" fill="#fff" stroke="#b8c0cc" stroke-width="1.4" transform="rotate(-0.65 1098.0 378.0)"/><text x="970" y="354.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#12151c" text-anchor="start" letter-spacing="0">Ничего не получает на руки</text><rect x="1256" y="330" width="284" height="96" rx="12" fill="#fff" stroke="#b8c0cc" stroke-width="1.4" transform="rotate(0.78 1398.0 378.0)"/><text x="1270" y="354.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#12151c" text-anchor="start" letter-spacing="0">Приезжает и надеется, что стол есть</text><rect x="40" y="460" width="1520" height="152" rx="18" fill="#FFECEF" stroke="#b8c0cc" stroke-width="1.2"/><text x="56" y="486" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800" fill="#525b6b" text-anchor="start" letter-spacing="1.4">ХОСТЕС</text><rect x="56" y="498" width="284" height="96" rx="12" fill="#fff" stroke="#b8c0cc" stroke-width="1.4" transform="rotate(0.78 198.0 546.0)"/><text x="70" y="522.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#12151c" text-anchor="start" letter-spacing="0">—</text><rect x="356" y="498" width="284" height="96" rx="12" fill="#fff" stroke="#b8c0cc" stroke-width="1.4"/><text x="370" y="522.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#12151c" text-anchor="start" letter-spacing="0">Отвечает между гостями в зале</text><rect x="656" y="498" width="284" height="96" rx="12" fill="#fff" stroke="#b8c0cc" stroke-width="1.4" transform="rotate(-0.65 798.0 546.0)"/><text x="670" y="522.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#12151c" text-anchor="start" letter-spacing="0">Держит схему зала в голове</text><rect x="956" y="498" width="284" height="96" rx="12" fill="#fff" stroke="#b8c0cc" stroke-width="1.4" transform="rotate(0.78 1098.0 546.0)"/><text x="970" y="522.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#12151c" text-anchor="start" letter-spacing="0">Пишет строку в бумажный блокнот</text><rect x="1256" y="498" width="284" height="96" rx="12" fill="#fff" stroke="#b8c0cc" stroke-width="1.4"/><text x="1270" y="522.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#12151c" text-anchor="start" letter-spacing="0">Ищет запись в блокноте, сверяет</text><text x="1270" y="539.55" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#12151c" text-anchor="start" letter-spacing="0">вручную</text><rect x="40" y="628" width="1520" height="152" rx="18" fill="#E7F0FF" stroke="#b8c0cc" stroke-width="1.2"/><text x="56" y="654" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800" fill="#525b6b" text-anchor="start" letter-spacing="1.4">РЕСТОРАН</text><rect x="56" y="666" width="284" height="96" rx="12" fill="#fff" stroke="#b8c0cc" stroke-width="1.4"/><text x="70" y="690.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#12151c" text-anchor="start" letter-spacing="0">Не знает, сколько людей до него не</text><text x="70" y="707.55" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#12151c" text-anchor="start" letter-spacing="0">дозвонилось</text><rect x="356" y="666" width="284" height="96" rx="12" fill="#fff" stroke="#b8c0cc" stroke-width="1.4" transform="rotate(-0.65 498.0 714.0)"/><text x="370" y="690.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#12151c" text-anchor="start" letter-spacing="0">Теряет спрос в час пик</text><rect x="656" y="666" width="284" height="96" rx="12" fill="#fff" stroke="#b8c0cc" stroke-width="1.4" transform="rotate(0.78 798.0 714.0)"/><text x="670" y="690.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#12151c" text-anchor="start" letter-spacing="0">Не видит, какие столы обещаны</text><rect x="956" y="666" width="284" height="96" rx="12" fill="#fff" stroke="#b8c0cc" stroke-width="1.4"/><text x="970" y="690.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#12151c" text-anchor="start" letter-spacing="0">Данные не попадают в систему</text><rect x="1256" y="666" width="284" height="96" rx="12" fill="#fff" stroke="#b8c0cc" stroke-width="1.4" transform="rotate(-0.65 1398.0 714.0)"/><text x="1270" y="690.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#12151c" text-anchor="start" letter-spacing="0">Узнает о неявке только по факту</text><text x="56" y="822" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800" fill="#525b6b" text-anchor="start" letter-spacing="1.4">ГДЕ ТЕРЯЕТСЯ</text><path d="M56 827 C 96.19999999999999 824, 149.8 830, 190 827" stroke="#D1082C" stroke-width="9" stroke-linecap="round" fill="none" opacity="0.4"/><rect x="56" y="854" width="732" height="52" rx="12" fill="#FDECEC" stroke="#E8A0A0" stroke-width="1.6" transform="rotate(0.65 422.0 880.0)"/><circle cx="84" cy="880" r="12" fill="#C62828"/><text x="84" y="885" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#fff" text-anchor="middle" letter-spacing="0">2</text><text x="108" y="885" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#7a1220" text-anchor="start" letter-spacing="0">Дозвон с 2–3 попыток</text><rect x="812" y="854" width="732" height="52" rx="12" fill="#FDECEC" stroke="#E8A0A0" stroke-width="1.6" transform="rotate(-0.78 1178.0 880.0)"/><circle cx="840" cy="880" r="12" fill="#C62828"/><text x="840" y="885" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#fff" text-anchor="middle" letter-spacing="0">3</text><text x="864" y="885" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#7a1220" text-anchor="start" letter-spacing="0">Подтверждения нет – только слово</text><rect x="56" y="920" width="732" height="52" rx="12" fill="#FDECEC" stroke="#E8A0A0" stroke-width="1.6" transform="rotate(0.65 422.0 946.0)"/><circle cx="84" cy="946" r="12" fill="#C62828"/><text x="84" y="951" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#fff" text-anchor="middle" letter-spacing="0">4</text><text x="108" y="951" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#7a1220" text-anchor="start" letter-spacing="0">Двойная бронь одного стола</text><rect x="812" y="920" width="732" height="52" rx="12" fill="#FDECEC" stroke="#E8A0A0" stroke-width="1.6" transform="rotate(-0.78 1178.0 946.0)"/><circle cx="840" cy="946" r="12" fill="#C62828"/><text x="840" y="951" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#fff" text-anchor="middle" letter-spacing="0">5</text><text x="864" y="951" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#7a1220" text-anchor="start" letter-spacing="0">Журнал не переживает смену</text><rect x="56" y="986" width="732" height="52" rx="12" fill="#FDECEC" stroke="#E8A0A0" stroke-width="1.6" transform="rotate(0.65 422.0 1012.0)"/><circle cx="84" cy="1012" r="12" fill="#C62828"/><text x="84" y="1017" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#fff" text-anchor="middle" letter-spacing="0">5</text><text x="108" y="1017" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#7a1220" text-anchor="start" letter-spacing="0">Неявку никто не отслеживает</text><rect x="812" y="986" width="732" height="52" rx="12" fill="#FDECEC" stroke="#E8A0A0" stroke-width="1.6" transform="rotate(-0.78 1178.0 1012.0)"/><circle cx="840" cy="1012" r="12" fill="#C62828"/><text x="840" y="1017" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#fff" text-anchor="middle" letter-spacing="0">1</text><text x="864" y="1017" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#7a1220" text-anchor="start" letter-spacing="0">Спрос не виден рестораном</text><rect x="40" y="1074" width="1520" height="92" rx="18" fill="#1B1030"/><text x="72" y="1112" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="start" letter-spacing="1.4">ВЫВОД ИССЛЕДОВАНИЯ</text><text x="72" y="1144" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500" fill="#ffffff" text-anchor="start" letter-spacing="0">Бронь ломается не в момент выбора ресторана, а в момент подтверждения: гость уходит без гарантии, ресторан – без данных.</text></svg>