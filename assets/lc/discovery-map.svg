<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1058" width="1600" height="1058"><rect width="1600" height="1000" fill="#FBFBFB"/><text x="56" y="74" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#111318" text-anchor="start" letter-spacing="0">Discovery: как бронь работает без продукта</text><text x="56" y="110" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#6b7280" text-anchor="start" letter-spacing="0">Карта текущего процесса. Три стороны, пять шагов, шесть точек потери.</text><rect x="56" y="136" width="214.6" height="38" rx="19" fill="#fff" stroke="#e3e4e8" stroke-width="1"/><circle cx="73" cy="155" r="4" fill="#D1082C"/><text x="86" y="161" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#111318" text-anchor="start" letter-spacing="0">Интервью с гостями</text><rect x="282.6" y="136" width="257.6" height="38" rx="19" fill="#fff" stroke="#e3e4e8" stroke-width="1"/><circle cx="299.6" cy="155" r="4" fill="#D1082C"/><text x="312.6" y="161" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#111318" text-anchor="start" letter-spacing="0">Интервью с рестораторами</text><rect x="552.2" y="136" width="266.2" height="38" rx="19" fill="#fff" stroke="#e3e4e8" stroke-width="1"/><circle cx="569.2" cy="155" r="4" fill="#D1082C"/><text x="582.2" y="161" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#111318" text-anchor="start" letter-spacing="0">Наблюдение за сменой хостес</text><rect x="830.4000000000001" y="136" width="214.6" height="38" rx="19" fill="#fff" stroke="#e3e4e8" stroke-width="1"/><circle cx="847.4000000000001" cy="155" r="4" fill="#D1082C"/><text x="860.4000000000001" y="161" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#111318" text-anchor="start" letter-spacing="0">Разбор журналов брони</text><text x="56" y="214" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#6b7280" text-anchor="start" letter-spacing="1.2">ШАГ 1</text><text x="56" y="240" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#111318" text-anchor="start" letter-spacing="0">Гость выбирает</text><text x="56" y="262" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#111318" text-anchor="start" letter-spacing="0">заведение</text><text x="360" y="214" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#6b7280" text-anchor="start" letter-spacing="1.2">ШАГ 2</text><text x="360" y="240" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#111318" text-anchor="start" letter-spacing="0">Звонок в ресторан</text><text x="664" y="214" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#6b7280" text-anchor="start" letter-spacing="1.2">ШАГ 3</text><text x="664" y="240" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#111318" text-anchor="start" letter-spacing="0">Ответ хостес</text><text x="968" y="214" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#6b7280" text-anchor="start" letter-spacing="1.2">ШАГ 4</text><text x="968" y="240" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#111318" text-anchor="start" letter-spacing="0">Запись в журнал</text><text x="1272" y="214" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#6b7280" text-anchor="start" letter-spacing="1.2">ШАГ 5</text><text x="1272" y="240" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#111318" text-anchor="start" letter-spacing="0">Приход гостя</text><rect x="40" y="276" width="1520" height="132" rx="18" fill="#F7F5FF"/><text x="56" y="302" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#6b7280" text-anchor="start" letter-spacing="1.4">ГОСТЬ</text><rect x="56" y="314" width="284" height="76" rx="12" fill="#fff" stroke="#e3e4e8" stroke-width="1"/><text x="72" y="338.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#111318" text-anchor="start" letter-spacing="0">Ищет телефон в поиске, соцсетях</text><text x="72" y="356.9" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#111318" text-anchor="start" letter-spacing="0">или у друзей</text><rect x="360" y="314" width="284" height="76" rx="12" fill="#fff" stroke="#e3e4e8" stroke-width="1"/><text x="376" y="338.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#111318" text-anchor="start" letter-spacing="0">Звонит; часто занято или никто</text><text x="376" y="356.9" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#111318" text-anchor="start" letter-spacing="0">не берет</text><rect x="664" y="314" width="284" height="76" rx="12" fill="#fff" stroke="#e3e4e8" stroke-width="1"/><text x="680" y="338.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#111318" text-anchor="start" letter-spacing="0">На слух запоминает время и</text><text x="680" y="356.9" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#111318" text-anchor="start" letter-spacing="0">условия</text><rect x="968" y="314" width="284" height="76" rx="12" fill="#fff" stroke="#e3e4e8" stroke-width="1"/><text x="984" y="338.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#111318" text-anchor="start" letter-spacing="0">Ничего не получает на руки</text><rect x="1272" y="314" width="284" height="76" rx="12" fill="#fff" stroke="#e3e4e8" stroke-width="1"/><text x="1288" y="338.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#111318" text-anchor="start" letter-spacing="0">Приезжает и надеется, что стол</text><text x="1288" y="356.9" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#111318" text-anchor="start" letter-spacing="0">есть</text><rect x="40" y="424" width="1520" height="132" rx="18" fill="#FFF6F7"/><text x="56" y="450" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#6b7280" text-anchor="start" letter-spacing="1.4">ХОСТЕС</text><rect x="56" y="462" width="284" height="76" rx="12" fill="#fff" stroke="#e3e4e8" stroke-width="1"/><text x="72" y="486.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#6b7280" text-anchor="start" letter-spacing="0">—</text><rect x="360" y="462" width="284" height="76" rx="12" fill="#fff" stroke="#e3e4e8" stroke-width="1"/><text x="376" y="486.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#111318" text-anchor="start" letter-spacing="0">Отвечает между гостями в зале</text><rect x="664" y="462" width="284" height="76" rx="12" fill="#fff" stroke="#e3e4e8" stroke-width="1"/><text x="680" y="486.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#111318" text-anchor="start" letter-spacing="0">Держит схему зала в голове</text><rect x="968" y="462" width="284" height="76" rx="12" fill="#fff" stroke="#e3e4e8" stroke-width="1"/><text x="984" y="486.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#111318" text-anchor="start" letter-spacing="0">Пишет строку в бумажный блокнот</text><rect x="1272" y="462" width="284" height="76" rx="12" fill="#fff" stroke="#e3e4e8" stroke-width="1"/><text x="1288" y="486.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#111318" text-anchor="start" letter-spacing="0">Ищет запись в блокноте, сверяет</text><text x="1288" y="504.9" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#111318" text-anchor="start" letter-spacing="0">вручную</text><rect x="40" y="572" width="1520" height="132" rx="18" fill="#F4F8FF"/><text x="56" y="598" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#6b7280" text-anchor="start" letter-spacing="1.4">РЕСТОРАН</text><rect x="56" y="610" width="284" height="76" rx="12" fill="#fff" stroke="#e3e4e8" stroke-width="1"/><text x="72" y="634.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#111318" text-anchor="start" letter-spacing="0">Не знает, сколько людей до него</text><text x="72" y="652.9" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#111318" text-anchor="start" letter-spacing="0">не дозвонилось</text><rect x="360" y="610" width="284" height="76" rx="12" fill="#fff" stroke="#e3e4e8" stroke-width="1"/><text x="376" y="634.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#111318" text-anchor="start" letter-spacing="0">Теряет спрос в час пик</text><rect x="664" y="610" width="284" height="76" rx="12" fill="#fff" stroke="#e3e4e8" stroke-width="1"/><text x="680" y="634.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#111318" text-anchor="start" letter-spacing="0">Не видит, какие столы обещаны</text><rect x="968" y="610" width="284" height="76" rx="12" fill="#fff" stroke="#e3e4e8" stroke-width="1"/><text x="984" y="634.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#111318" text-anchor="start" letter-spacing="0">Данные не попадают в систему</text><rect x="1272" y="610" width="284" height="76" rx="12" fill="#fff" stroke="#e3e4e8" stroke-width="1"/><text x="1288" y="634.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#111318" text-anchor="start" letter-spacing="0">Узнает о неявке только по факту</text><text x="56" y="746" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#6b7280" text-anchor="start" letter-spacing="1.4">ГДЕ ТЕРЯЕТСЯ</text><rect x="56" y="778" width="470" height="52" rx="12" fill="#FFF3F4" stroke="#F3C9CF" stroke-width="1"/><circle cx="82" cy="804" r="11" fill="#D1082C"/><text x="82" y="809" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="0">2</text><text x="106" y="809" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#7a1220" text-anchor="start" letter-spacing="0">Дозвон с 2–3 попыток</text><rect x="556" y="778" width="470" height="52" rx="12" fill="#FFF3F4" stroke="#F3C9CF" stroke-width="1"/><circle cx="582" cy="804" r="11" fill="#D1082C"/><text x="582" y="809" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="0">3</text><text x="606" y="809" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#7a1220" text-anchor="start" letter-spacing="0">Подтверждения нет – только слово</text><rect x="1056" y="778" width="470" height="52" rx="12" fill="#FFF3F4" stroke="#F3C9CF" stroke-width="1"/><circle cx="1082" cy="804" r="11" fill="#D1082C"/><text x="1082" y="809" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="0">4</text><text x="1106" y="809" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#7a1220" text-anchor="start" letter-spacing="0">Двойная бронь одного стола</text><rect x="56" y="844" width="470" height="52" rx="12" fill="#FFF3F4" stroke="#F3C9CF" stroke-width="1"/><circle cx="82" cy="870" r="11" fill="#D1082C"/><text x="82" y="875" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="0">5</text><text x="106" y="875" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#7a1220" text-anchor="start" letter-spacing="0">Журнал не переживает смену</text><rect x="556" y="844" width="470" height="52" rx="12" fill="#FFF3F4" stroke="#F3C9CF" stroke-width="1"/><circle cx="582" cy="870" r="11" fill="#D1082C"/><text x="582" y="875" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="0">5</text><text x="606" y="875" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#7a1220" text-anchor="start" letter-spacing="0">Неявку никто не отслеживает</text><rect x="1056" y="844" width="470" height="52" rx="12" fill="#FFF3F4" stroke="#F3C9CF" stroke-width="1"/><circle cx="1082" cy="870" r="11" fill="#D1082C"/><text x="1082" y="875" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="0">1</text><text x="1106" y="875" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#7a1220" text-anchor="start" letter-spacing="0">Спрос не виден рестораном</text><rect x="40" y="932" width="1520" height="86" rx="18" fill="#111318" stroke="#111318" stroke-width="1"/><text x="72" y="970" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#9aa1ad" text-anchor="start" letter-spacing="1.2">Вывод исследования</text><text x="72" y="1000" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500" fill="#ffffff" text-anchor="start" letter-spacing="0">Бронь ломается не в момент выбора ресторана, а в момент подтверждения: гость уходит без гарантии, ресторан – без данных.</text></svg>