<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1206" width="1600" height="1206"><rect width="1600" height="4000" fill="#F1F3F7"/><text x="56" y="74" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#12151c" text-anchor="start" letter-spacing="0">Discovery: how booking works without a product</text><path d="M58 84 C 271.9 81, 557.0999999999999 87, 771.0 84" stroke="#D1082C" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.35"/><text x="56" y="112" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#525b6b" text-anchor="start" letter-spacing="0">A map of the current process. Three sides, five steps, six points of loss.</text><rect x="56" y="140" width="172.4" height="40" rx="20" fill="#fff" stroke="#b8c0cc" stroke-width="1.4"/><circle cx="74" cy="160" r="5" fill="#D1082C"/><text x="88" y="166" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#12151c" text-anchor="start" letter-spacing="0">Guest interviews</text><rect x="240.4" y="140" width="231.20000000000002" height="40" rx="20" fill="#fff" stroke="#b8c0cc" stroke-width="1.4"/><circle cx="258.4" cy="160" r="5" fill="#D1082C"/><text x="272.4" y="166" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#12151c" text-anchor="start" letter-spacing="0">Restaurateur interviews</text><rect x="483.6" y="140" width="239.60000000000002" height="40" rx="20" fill="#fff" stroke="#b8c0cc" stroke-width="1.4"/><circle cx="501.6" cy="160" r="5" fill="#D1082C"/><text x="515.6" y="166" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#12151c" text-anchor="start" letter-spacing="0">Shadowing a host’s shift</text><rect x="735.2" y="140" width="222.8" height="40" rx="20" fill="#fff" stroke="#b8c0cc" stroke-width="1.4"/><circle cx="753.2" cy="160" r="5" fill="#D1082C"/><text x="767.2" y="166" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#12151c" text-anchor="start" letter-spacing="0">Booking logbook review</text><text x="56" y="222" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#525b6b" text-anchor="start" letter-spacing="1.2">STEP 1</text><text x="56" y="248" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#12151c" text-anchor="start" letter-spacing="0">Guest picks</text><text x="56" y="269" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#12151c" text-anchor="start" letter-spacing="0">a venue</text><text x="356" y="222" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#525b6b" text-anchor="start" letter-spacing="1.2">STEP 2</text><text x="356" y="248" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#12151c" text-anchor="start" letter-spacing="0">Calls the</text><text x="356" y="269" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#12151c" text-anchor="start" letter-spacing="0">restaurant</text><text x="656" y="222" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#525b6b" text-anchor="start" letter-spacing="1.2">STEP 3</text><text x="656" y="248" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#12151c" text-anchor="start" letter-spacing="0">Host answers</text><text x="956" y="222" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#525b6b" text-anchor="start" letter-spacing="1.2">STEP 4</text><text x="956" y="248" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#12151c" text-anchor="start" letter-spacing="0">Written in</text><text x="956" y="269" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#12151c" text-anchor="start" letter-spacing="0">the logbook</text><text x="1256" y="222" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#525b6b" text-anchor="start" letter-spacing="1.2">STEP 5</text><text x="1256" y="248" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#12151c" text-anchor="start" letter-spacing="0">Guest arrives</text><rect x="40" y="292" width="1520" height="152" rx="18" fill="#EFEBFF" stroke="#b8c0cc" stroke-width="1.2"/><text x="56" y="318" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800" fill="#525b6b" text-anchor="start" letter-spacing="1.4">GUEST</text><rect x="56" y="330" width="284" height="96" rx="12" fill="#fff" stroke="#b8c0cc" stroke-width="1.4" transform="rotate(-0.7 198.0 378.0)"/><text x="70" y="354.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#12151c" text-anchor="start" letter-spacing="0">Looks up the number in search, social</text><text x="70" y="371.55" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#12151c" text-anchor="start" letter-spacing="0">media or from friends</text><rect x="356" y="330" width="284" height="96" rx="12" fill="#fff" stroke="#b8c0cc" stroke-width="1.4" transform="rotate(0.8 498.0 378.0)"/><text x="370" y="354.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#12151c" text-anchor="start" letter-spacing="0">Calls; the line is busy or nobody</text><text x="370" y="371.55" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#12151c" text-anchor="start" letter-spacing="0">picks up</text><rect x="656" y="330" width="284" height="96" rx="12" fill="#fff" stroke="#b8c0cc" stroke-width="1.4"/><text x="670" y="354.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#12151c" text-anchor="start" letter-spacing="0">Memorises the time and terms by ear</text><rect x="956" y="330" width="284" height="96" rx="12" fill="#fff" stroke="#b8c0cc" stroke-width="1.4" transform="rotate(-0.7 1098.0 378.0)"/><text x="970" y="354.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#12151c" text-anchor="start" letter-spacing="0">Gets nothing in writing</text><rect x="1256" y="330" width="284" height="96" rx="12" fill="#fff" stroke="#b8c0cc" stroke-width="1.4" transform="rotate(0.8 1398.0 378.0)"/><text x="1270" y="354.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#12151c" text-anchor="start" letter-spacing="0">Arrives hoping the table is there</text><rect x="40" y="460" width="1520" height="152" rx="18" fill="#FFECEF" stroke="#b8c0cc" stroke-width="1.2"/><text x="56" y="486" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800" fill="#525b6b" text-anchor="start" letter-spacing="1.4">HOST</text><rect x="56" y="498" width="284" height="96" rx="12" fill="#fff" stroke="#b8c0cc" stroke-width="1.4" transform="rotate(0.8 198.0 546.0)"/><text x="70" y="522.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#12151c" text-anchor="start" letter-spacing="0">—</text><rect x="356" y="498" width="284" height="96" rx="12" fill="#fff" stroke="#b8c0cc" stroke-width="1.4"/><text x="370" y="522.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#12151c" text-anchor="start" letter-spacing="0">Answers between guests on the floor</text><rect x="656" y="498" width="284" height="96" rx="12" fill="#fff" stroke="#b8c0cc" stroke-width="1.4" transform="rotate(-0.7 798.0 546.0)"/><text x="670" y="522.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#12151c" text-anchor="start" letter-spacing="0">Keeps the floor plan in their head</text><rect x="956" y="498" width="284" height="96" rx="12" fill="#fff" stroke="#b8c0cc" stroke-width="1.4" transform="rotate(0.8 1098.0 546.0)"/><text x="970" y="522.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#12151c" text-anchor="start" letter-spacing="0">Writes a line in a paper notebook</text><rect x="1256" y="498" width="284" height="96" rx="12" fill="#fff" stroke="#b8c0cc" stroke-width="1.4"/><text x="1270" y="522.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#12151c" text-anchor="start" letter-spacing="0">Looks the record up and checks it by</text><text x="1270" y="539.55" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#12151c" text-anchor="start" letter-spacing="0">hand</text><rect x="40" y="628" width="1520" height="152" rx="18" fill="#E7F0FF" stroke="#b8c0cc" stroke-width="1.2"/><text x="56" y="654" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800" fill="#525b6b" text-anchor="start" letter-spacing="1.4">RESTAURANT</text><rect x="56" y="666" width="284" height="96" rx="12" fill="#fff" stroke="#b8c0cc" stroke-width="1.4"/><text x="70" y="690.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#12151c" text-anchor="start" letter-spacing="0">No idea how many people never got</text><text x="70" y="707.55" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#12151c" text-anchor="start" letter-spacing="0">through</text><rect x="356" y="666" width="284" height="96" rx="12" fill="#fff" stroke="#b8c0cc" stroke-width="1.4" transform="rotate(-0.7 498.0 714.0)"/><text x="370" y="690.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#12151c" text-anchor="start" letter-spacing="0">Loses demand at peak hours</text><rect x="656" y="666" width="284" height="96" rx="12" fill="#fff" stroke="#b8c0cc" stroke-width="1.4" transform="rotate(0.8 798.0 714.0)"/><text x="670" y="690.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#12151c" text-anchor="start" letter-spacing="0">Cannot see which tables are promised</text><rect x="956" y="666" width="284" height="96" rx="12" fill="#fff" stroke="#b8c0cc" stroke-width="1.4"/><text x="970" y="690.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#12151c" text-anchor="start" letter-spacing="0">The data never reaches a system</text><rect x="1256" y="666" width="284" height="96" rx="12" fill="#fff" stroke="#b8c0cc" stroke-width="1.4" transform="rotate(-0.7 1398.0 714.0)"/><text x="1270" y="690.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#12151c" text-anchor="start" letter-spacing="0">Learns about a no-show after the fact</text><text x="56" y="822" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800" fill="#525b6b" text-anchor="start" letter-spacing="1.4">WHERE IT BREAKS</text><path d="M56 827 C 101.0 824, 161.0 830, 206 827" stroke="#D1082C" stroke-width="9" stroke-linecap="round" fill="none" opacity="0.4"/><rect x="56" y="854" width="732" height="52" rx="12" fill="#FDECEC" stroke="#E8A0A0" stroke-width="1.6" transform="rotate(0.7 422.0 880.0)"/><circle cx="84" cy="880" r="12" fill="#C62828"/><text x="84" y="885" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#fff" text-anchor="middle" letter-spacing="0">2</text><text x="108" y="885" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#7a1220" text-anchor="start" letter-spacing="0">Two or three attempts to get through</text><rect x="812" y="854" width="732" height="52" rx="12" fill="#FDECEC" stroke="#E8A0A0" stroke-width="1.6" transform="rotate(-0.8 1178.0 880.0)"/><circle cx="840" cy="880" r="12" fill="#C62828"/><text x="840" y="885" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#fff" text-anchor="middle" letter-spacing="0">3</text><text x="864" y="885" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#7a1220" text-anchor="start" letter-spacing="0">No confirmation, just a spoken promise</text><rect x="56" y="920" width="732" height="52" rx="12" fill="#FDECEC" stroke="#E8A0A0" stroke-width="1.6" transform="rotate(0.7 422.0 946.0)"/><circle cx="84" cy="946" r="12" fill="#C62828"/><text x="84" y="951" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#fff" text-anchor="middle" letter-spacing="0">4</text><text x="108" y="951" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#7a1220" text-anchor="start" letter-spacing="0">The same table booked twice</text><rect x="812" y="920" width="732" height="52" rx="12" fill="#FDECEC" stroke="#E8A0A0" stroke-width="1.6" transform="rotate(-0.8 1178.0 946.0)"/><circle cx="840" cy="946" r="12" fill="#C62828"/><text x="840" y="951" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#fff" text-anchor="middle" letter-spacing="0">5</text><text x="864" y="951" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#7a1220" text-anchor="start" letter-spacing="0">The logbook does not survive a shift change</text><rect x="56" y="986" width="732" height="52" rx="12" fill="#FDECEC" stroke="#E8A0A0" stroke-width="1.6" transform="rotate(0.7 422.0 1012.0)"/><circle cx="84" cy="1012" r="12" fill="#C62828"/><text x="84" y="1017" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#fff" text-anchor="middle" letter-spacing="0">5</text><text x="108" y="1017" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#7a1220" text-anchor="start" letter-spacing="0">Nobody tracks no-shows</text><rect x="812" y="986" width="732" height="52" rx="12" fill="#FDECEC" stroke="#E8A0A0" stroke-width="1.6" transform="rotate(-0.8 1178.0 1012.0)"/><circle cx="840" cy="1012" r="12" fill="#C62828"/><text x="840" y="1017" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#fff" text-anchor="middle" letter-spacing="0">1</text><text x="864" y="1017" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#7a1220" text-anchor="start" letter-spacing="0">The restaurant cannot see the demand</text><rect x="40" y="1074" width="1520" height="92" rx="18" fill="#1B1030"/><text x="72" y="1112" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="start" letter-spacing="1.4">RESEARCH FINDING</text><text x="72" y="1144" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500" fill="#ffffff" text-anchor="start" letter-spacing="0">Booking breaks not when the restaurant is chosen but at confirmation: the guest leaves without a guarantee, the restaurant without data.</text></svg>