<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Первый экран — шрифтом</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
  :root { --ink:#000; --g1:#9828BF; --g2:#F59D0F; }
  * { box-sizing:border-box }
  body { margin:0; background:#fafafa; font-family:Inter,-apple-system,sans-serif; }
  .page { padding:40px 80px; }
  /* Артборд повторяет пропорции исходного SVG (830×442).
     Все размеры — в cqw, поэтому блок масштабируется ровно как картинка. */
  .art {
    position:relative;
    width:100%;
    max-width:830px;
    aspect-ratio:830/442;
    container-type:inline-size;
  }
  .ava {
    position:absolute; left:0; top:0;
    width:15.181cqw; height:15.181cqw;   /* 126/830 */
    border-radius:50%; object-fit:cover; display:block;
  }
  .head {
    position:absolute; left:20.241cqw; top:-0.518cqw;   /* 168/830, минус полулидинг */
    margin:0;
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
    font-weight:700;
    font-size:6.024cqw;        /* 50/830 */
    line-height:0.920;         /* 46/50 */
    letter-spacing:0;
    color:var(--ink);
    white-space:pre-line;
  }
  .letters {
    position:absolute; left:-0.723cqw; top:18.590cqw;  /* -6/830; базовая линия 290 минус полулидинг */
    margin:0;
    font-weight:900;
    font-size:20.120cqw;       /* 167/830 */
    line-height:0.898;         /* 150/167 */
    letter-spacing:0.006em;    /* 1/167 */
    white-space:pre-line;
    background-image:linear-gradient(51.7deg, var(--g1) 0%, var(--g2) 100%);
    background-size:100cqw 53.253cqw;   /* градиент натянут на весь артборд, как в SVG */
    background-position:0 -18.590cqw;
    background-repeat:no-repeat;
    -webkit-background-clip:text; background-clip:text;
    color:transparent;
  }
  @media (max-width:960px){ .page{ padding:24px 40px } }
  @media (max-width:640px){ .page{ padding:16px 20px } }
</style></head>
<body>
<div class="page">
  <div class="art">
    <img class="ava" src="avatar.png" alt="Владимир">
    <h1 class="head">Создаю дизайн,
который помогает
бизнесу расти</h1>
    <p class="letters">PRODUCT
DESIGN</p>
  </div>
</div>
</body></html>
